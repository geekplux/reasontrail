<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reasontrail: see what your coding agent did</title>
    <meta name="description" content="Reasontrail turns an AI coding-agent session into a map: the task, the route it took, where it got stuck and what changed. Runs locally; nothing is uploaded." />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Reasontrail: see what your coding agent did" />
    <meta property="og:description" content="One command turns a Claude Code session into a self-contained map of what the agent did: task, route, trouble and outcome. Built-in samples work offline, with no key." />
    <meta property="og:type" content="website" />
    <!-- The link-preview card (public/og.jpg, 1200×630) and its moving version (public/og.mp4). Per-sample cards and
         titles for ?session= links need the Worker to rewrite these tags (follow-up). -->
    <meta property="og:url" content="https://reasontrail.geekplux.com/" />
    <meta property="og:image" content="https://reasontrail.geekplux.com/og.jpg" />
    <link rel="canonical" href="https://reasontrail.geekplux.com/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reasontrail: see how your coding agent got there, its session drawn as a tree of subagents and tool calls." />
    <!-- og:video: the same card, moving (1200 × 630, silent H.264). Platforms that play it
         (iMessage, Discord) show it; the rest show og:image. -->
    <meta property="og:video" content="https://reasontrail.geekplux.com/og.mp4" />
    <meta property="og:video:secure_url" content="https://reasontrail.geekplux.com/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  </head>
  <body>
    <noscript>
      <p class="noscript">
        Reasontrail maps what an AI coding agent did in a session. This page also holds its zoom-in lens, a garden of
        next-token branches. It needs JavaScript to run. Read about it at
        <a href="https://github.com/geekplux/reasontrail#readme">github.com/geekplux/reasontrail</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
