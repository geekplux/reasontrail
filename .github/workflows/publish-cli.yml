# Publishes the `reasontrail` CLI (cli/) to npm. Runbook and one-time setup: docs/PUBLISH.md.
#
# Trigger: publish a GitHub release whose tag is `cli-v<version>` (for example `cli-v0.1.0`), matching
# `version` in cli/package.json. A pre-release publishes under the npm dist-tag `next` instead of `latest`.
# Manual runs (Actions > publish-cli > Run workflow) default to a dry run that publishes nothing.
#
# Auth: npm trusted publishing (OIDC, `id-token: write`), no stored token. Fallback: a repository secret
# NPM_TOKEN (granular, publish rights for `reasontrail` only); npm tries OIDC first and uses the token only
# if no trusted publisher matches. Provenance is attached automatically with OIDC once the repo is public.
name: publish-cli

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    # Releases for anything other than the CLI (tags not starting with cli-v) are ignored.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional protection: add required reviewers to the `npm` environment in the repo settings.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # pnpm version from package.json "packageManager"
      # Node 24 ships npm 11 (trusted publishing needs npm >= 11.5.1 and Node >= 22.14). No registry-url on purpose:
      # an empty injected token can get in the way of OIDC, so an .npmrc is written only on the NPM_TOKEN path below.
      # No dependency cache in a release build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the tag, the version and the private flag
        run: |
          version=$(node -p "require('./cli/package.json').version")
          name=$(node -p "require('./cli/package.json').name")
          private=$(node -p "require('./cli/package.json').private === true")
          echo "package: $name@$version, tag: $TAG, dry run: $DRY_RUN"
          if [ "$DRY_RUN" != "true" ] && [ "$TAG" != "cli-v$version" ]; then
            echo "::error::Tag '$TAG' does not match cli/package.json version $version (expected cli-v$version)."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$private" = "true" ]; then
            echo "::error::cli/package.json still has \"private\": true. Remove it (docs/PUBLISH.md, step 3) and tag again."
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Bump the version in cli/package.json."
            exit 1
          fi
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:cli
      - run: pnpm check:pack
      - name: The built CLI runs and reports the package version
        run: |
          out=$(node cli/dist/cli.mjs --version)
          echo "$out"
          echo "$out" | grep -F "$(node -p "require('./cli/package.json').version")"

      - name: Publish to npm
        working-directory: cli
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # unset with trusted publishing; fallback / first-publish bootstrap only
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          # Provenance needs a public repository (npm cannot attest builds from private repos).
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Auth: NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          else
            echo "Auth: trusted publishing (OIDC)"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            # A dry run must not trip over "private": true, so it packs instead of publishing.
            npm pack --dry-run
            echo "Dry run: nothing published."
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
