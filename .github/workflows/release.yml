# Publish the `reasontrail` CLI (cli/) to npm when a v<digit>* tag is pushed (v0.1.1); docs/PUBLISH.md.
# The same setup as vert and markvis: it runs the whole ci.yml first, then publishes with provenance.
# No token: npm trusted publishing authenticates this workflow through GitHub OIDC.
name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11.6.2

      - name: Tag matches cli/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match cli/package.json version $version"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tarball holds only the built CLI, the viewer template, package.json, README and LICENSE.
      - name: Build and check the package
        run: |
          pnpm build:cli
          pnpm check:pack
          node cli/dist/cli.mjs --version

      - name: Publish
        working-directory: cli
        run: npm publish --provenance --access public
