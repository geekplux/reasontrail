<!doctype html>
<!-- Social preview template (v7), drawn at 640×320 CSS px and rendered at 2× to 1280×640 by
     `pnpm check:browser --flows brand`, which inlines every relative file (the hero still and the two fonts) as data
     URLs and writes docs/brand/social-preview.png. Opened directly from a clone it shows the same layout.
     Light Radix tokens (src/styles/tokens.css), Geist, the four type sizes, the veined-leaf wordmark, and the home's tree
     cut from docs/brand/hero.webp (the 1440×900 home: the hero is cut from under the site header, so the tree is drawn
     in x 120–1320, y 264–736 under its legend row, which is left out). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reasontrail social preview</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 640px; height: 320px; overflow: hidden; }
  body { position: relative; padding: 24px 32px 0; background: #fcfcfd; color: #1c2024; font: 400 14px/1.4 Geist, system-ui, sans-serif; font-feature-settings: "tnum"; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 20px; }
  .mark { display: flex; align-items: center; gap: 8px; margin-left: -1px; font-weight: 600; letter-spacing: -0.01em; }
  .mark svg { width: 20px; height: 20px; }
  .repo { font: 400 12px 'Geist Mono', ui-monospace, monospace; color: #60646c; }
  h1 { margin-top: 20px; font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -0.025em; }
  /* The tree, cut out of the hero: 1200 × 472 from (120, 264) at 0.44 (528 × 208), its root on the 32px edge. */
  figure { position: absolute; left: 32px; top: 112px; width: 528px; height: 208px; overflow: hidden; }
  figure img { display: block; width: 633.6px; margin: -116.16px 0 0 -52.8px; }
</style>
</head>
<body>
  <div class="top">
    <span class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M6 58C6 28 28 6 58 6Z" fill="#0090ff"/>
        <path d="M6 58C36 58 58 36 58 6Z" fill="#f76b15"/>
        <path d="M8 56L56 8M20 44C17 38 16 31 17 25M31 33C37 35 43 35 49 33M41 23C39 19 39 15 40 11" fill="none" stroke="#fcfcfd" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      Reasontrail
    </span>
    <span class="repo">github.com/geekplux/reasontrail</span>
  </div>
  <h1>See how your coding agent got there.</h1>
  <figure><img src="hero.webp" alt="The tree of a real coding-agent session: the main agent as the trunk, three subagents as limbs, episodes as branches, tool calls as twigs with leaves, failed calls as orange twigs with an x."></figure>
</body>
</html>
