    <text x="768" y="26" text-anchor="end" class="mono cnt">7.6 min · jsonl:118</text>
    <use href="#k-change" x="17" y="41" width="14" height="14"/>
    <text x="42" y="53" class="mono muted" font-size="12.5">write src/App.tsx</text>
    <text x="768" y="53" text-anchor="end" class="mono cnt">7.9 min · jsonl:124</text>
    <rect x="1" y="62" width="782" height="26" fill="#f3e3cf"/>
    <rect x="1" y="62" width="4" height="26" fill="#1c2620"/>
    <use href="#s-err" x="16" y="67" width="16" height="16"/>
    <text x="42" y="80" class="mono ink" font-size="12.5" font-weight="600">pnpm -s test</text>
    <text x="200" y="80" font-size="12.8" class="ink">failed · exit 1</text>
    <text x="768" y="80" text-anchor="end" class="mono cnt">26.3 min · jsonl:212</text>
    <use href="#k-change" x="17" y="95" width="14" height="14"/>
    <text x="42" y="107" class="mono muted" font-size="12.5">write scripts/browser/flows/explore.mjs</text>
    <text x="768" y="107" text-anchor="end" class="mono cnt">27.0 min · jsonl:220</text>
    <rect x="1" y="116" width="782" height="26" fill="#f3e3cf"/>
    <use href="#s-err" x="16" y="121" width="16" height="16"/>
    <text x="42" y="134" class="mono ink" font-size="12.5">pnpm -s test</text>
    <text x="200" y="134" font-size="12.8" class="ink">failed · exit 1</text>
    <text x="768" y="134" text-anchor="end" class="mono cnt">29.2 min · jsonl:298</text>
    <g transform="translate(16 148)"><rect x="0.75" y="0.75" width="14.5" height="14.5" rx="2" fill="none" stroke="#4d5a52" stroke-width="1.5" stroke-dasharray="2 2"/></g>
    <text x="42" y="161" class="muted" font-size="12.5">thinking (text not stored) ×3</text>
    <text x="768" y="161" text-anchor="end" class="mono cnt">jsonl:301–322</text>
    <rect x="1" y="170" width="782" height="26" fill="#f3e3cf"/>
    <use href="#s-err" x="16" y="175" width="16" height="16"/>
    <text x="42" y="188" class="mono ink" font-size="12.5">pnpm -s test</text>
    <text x="200" y="188" font-size="12.8" class="ink">failed · exit 1</text>
    <text x="768" y="188" text-anchor="end" class="mono cnt">33.7 min · jsonl:331</text>
    <use href="#s-ok" x="16" y="202" width="16" height="16"/>
    <text x="42" y="215" class="mono ink" font-size="12.5">pnpm -s test</text>
    <text x="200" y="215" font-size="12.8" class="ink">passed · exit 0</text>
    <text x="768" y="215" text-anchor="end" class="mono cnt">34.0 min · jsonl:340</text>
  </g>
