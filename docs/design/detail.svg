<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
  <title>Reasontrail detail view, 1280×800 wireframe (DESIGN.md §9): a subagent lane expanded in place, a trouble marker selected, its evidence in the detail panel with provenance and Show raw. Counts from the real implementer run (62 tool calls, 36 min); output text paraphrased.</title>
  <style>
    .paper { fill: #f6f3ea } .surface { fill: #fffdf7 } .ink { fill: #1c2620 } .muted { fill: #4d5a52 }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-weight: 500 }
    .serif { font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif; font-style: italic }
    .cap { font-size: 11.5px; letter-spacing: 0.12em }
    .rule { stroke: #d9d3c3; stroke-width: 1 }
    .route { stroke: #1c2620; stroke-width: 4; fill: none; stroke-linecap: round }
    .side { stroke: #5f7d6c; stroke-width: 2; fill: none; stroke-linejoin: round }
    .ann { fill: #1c2620 } .ann-t { fill: #fffdf7; font-size: 11px; font-weight: 600 }
    .ep { font-size: 13px; font-weight: 600; fill: #1c2620 }
    .cnt { font-size: 11.5px; fill: #4d5a52 }
    .lane { font-size: 11.5px; fill: #1c2620 }
    a text { text-decoration: underline }
  </style>
  <defs>
    <!-- Episode kind glyphs (ink, shape = kind) -->
    <symbol id="k-user" viewBox="-7 -7 14 14"><path d="M-4 -5.5 L5.5 0 L-4 5.5Z" fill="#1c2620"/></symbol>
    <symbol id="k-explore" viewBox="-7 -7 14 14"><circle r="4.5" fill="#f6f3ea" stroke="#1c2620" stroke-width="2"/></symbol>
    <symbol id="k-change" viewBox="-7 -7 14 14"><rect x="-4.5" y="-4.5" width="9" height="9" fill="#1c2620"/></symbol>
    <symbol id="k-verify" viewBox="-7 -7 14 14"><path d="M0 -6 L6 0 L0 6 L-6 0Z" fill="#f6f3ea" stroke="#1c2620" stroke-width="2"/></symbol>
    <symbol id="k-delegate" viewBox="-7 -7 14 14"><circle r="5" fill="#1c2620"/><circle r="1.8" fill="#f6f3ea"/></symbol>
    <symbol id="k-user-dim" viewBox="-7 -7 14 14"><path d="M-4 -5.5 L5.5 0 L-4 5.5Z" fill="#4d5a52"/></symbol>
    <symbol id="k-delegate-dim" viewBox="-7 -7 14 14"><circle r="5" fill="#4d5a52"/><circle r="1.8" fill="#f6f3ea"/></symbol>
    <symbol id="k-answer" viewBox="-8 -8 16 16"><circle r="6" fill="#f6f3ea" stroke="#1c2620" stroke-width="2"/><circle r="2.4" fill="#1c2620"/></symbol>
    <!-- Status glyphs (hue + shape; always with a word nearby) -->
    <symbol id="s-ok" viewBox="-8 -8 16 16"><circle r="7" fill="#1a6fa0"/><path d="M-3.5 0.2 L-1 2.8 L3.8 -2.6" stroke="#fffdf7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="s-err" viewBox="-8 -8 16 16"><circle r="7" fill="#a3292b"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke="#fffdf7" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="s-int" viewBox="-8 -8 16 16"><circle r="6.5" fill="#f6f3ea" stroke="#4d5a52" stroke-width="1.5"/><path d="M-2 -3 V3 M2 -3 V3" stroke="#4d5a52" stroke-width="2"/></symbol>
    <!-- Trouble blazes: 20×20 plate. Unresolved = filled blaze; resolved = outlined -->
    <symbol id="t-streak" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="2" fill="#fffdf7" stroke="#a3292b" stroke-width="2"/><path d="M5 5 L9 9 M9 5 L5 9 M11 11 L15 15 M15 11 L11 15" stroke="#a3292b" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="t-revert" viewBox="0 0 20 20"><rect x="0" y="0" width="20" height="20" rx="2" fill="#a3292b"/><path d="M14.5 15 V8.5 A3.5 3.5 0 0 0 7.5 8.5 V12" stroke="#fffdf7" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4.5 10 L7.5 13.5 L10.5 10" stroke="#fffdf7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="t-interrupt" viewBox="0 0 20 20"><rect x="0" y="0" width="20" height="20" rx="2" fill="#a3292b"/><path d="M7.5 5 V15 M12.5 5 V15" stroke="#fffdf7" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="badge" viewBox="-8 -8 16 16"><circle r="7.5" fill="#1c2620"/></symbol>
  </defs>
  <rect class="paper" width="1280" height="800"/>
  <!-- header -->
  <g transform="translate(32 12)" fill="none" stroke="#1c2620" stroke-linecap="round">
    <circle cx="4.5" cy="20" r="3.5" fill="#1c2620" stroke="none"/>
    <path d="M4.5 20 H11 L19 12 H22" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M11 20 H19.5" stroke-width="2"/><path d="M21.5 16.5 V23.5" stroke-width="2"/>
    <circle cx="26.5" cy="12" r="4" stroke-width="2.5"/><circle cx="26.5" cy="12" r="1.5" fill="#1c2620" stroke="none"/>
  </g>
  <text x="72" y="36" class="mono ink" font-size="20">reason</text><text x="144" y="36" class="serif ink" font-size="25">trail</text>
  <g transform="translate(470 13)">
    <rect width="184" height="30" rx="2" fill="#fffdf7" stroke="#1c2620"/><rect width="92" height="30" rx="2" fill="#1c2620"/>
    <text x="46" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#fffdf7">Map</text>
    <text x="138" y="20" text-anchor="middle" font-size="13" class="ink">Outline</text>
  </g>
  <g transform="translate(1064 13)"><rect width="184" height="30" rx="2" fill="#fffdf7" stroke="#1c2620"/><text x="92" y="20" text-anchor="middle" font-size="13" class="ink">Save shareable copy…</text></g>
