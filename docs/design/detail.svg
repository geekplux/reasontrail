  <text x="864" y="472" class="mono cap muted">PROVENANCE</text>
  <text x="864" y="494" class="mono ink" font-size="12.5">subagents/agent-a24c….jsonl:212</text>
  <text x="864" y="512" class="mono muted" font-size="12">record uuid 3f2a…c91 · tool call toolu_…7Hq</text>
  <g transform="translate(864 528)"><rect width="104" height="32" rx="2" fill="#fffdf7" stroke="#1c2620"/><text x="52" y="21" text-anchor="middle" font-size="13" class="ink">Show raw</text></g>
  <g transform="translate(978 528)"><rect width="148" height="32" rx="2" fill="#fffdf7" stroke="#1c2620"/><text x="74" y="21" text-anchor="middle" font-size="13" class="ink">Copy link to step</text></g>
  <!-- raw preview collapsed state hint -->
  <text x="864" y="588" font-size="12.8" class="muted">Verbatim record; redacted in samples and shared copies.</text>

  <!-- step navigation -->
  <line x1="864" y1="612.5" x2="1248" y2="612.5" class="rule"/>
  <g transform="translate(864 628)"><rect width="148" height="32" rx="2" fill="#fffdf7" stroke="#1c2620"/><text x="74" y="21" text-anchor="middle" font-size="13" class="ink">← Previous evidence</text></g>
  <g transform="translate(1100 628)"><rect width="148" height="32" rx="2" fill="#fffdf7" stroke="#1c2620"/><text x="74" y="21" text-anchor="middle" font-size="13" class="ink">Next evidence →</text></g>
  <text x="864" y="696" font-size="12.8" class="muted">Found by the rule “2 or more failed results in a row”.</text>
  <text x="864" y="714" font-size="12.8" class="muted">A rule, not AI. Keys: ← → steps · [ ] patterns · Esc closes.</text>
  <g><rect x="1150" y="470" width="98" height="18" rx="9" class="ann"/><text x="1199" y="483" text-anchor="middle" class="ann-t">provenance</text></g>
