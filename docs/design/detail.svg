  <g><rect x="700" y="614" width="116" height="18" rx="9" class="ann"/><text x="758" y="627" text-anchor="middle" class="ann-t">evidence wash</text></g>

  <!-- ===== detail panel ===== -->
  <rect x="840" y="57" width="440" height="743" class="surface"/>
  <line x1="840.5" y1="57" x2="840.5" y2="800" stroke="#1c2620"/>
  <text x="864" y="88" class="mono cnt">implementer › Run checks ×5 › pattern 2 of 3</text>
  <g transform="translate(1212 72)"><rect width="36" height="28" rx="2" fill="#fffdf7" stroke="#1c2620"/><path d="M13 9 L23 19 M23 9 L13 19" stroke="#1c2620" stroke-width="1.75" stroke-linecap="round"/></g>
  <use href="#t-streak" x="864" y="108" width="20" height="20"/>
  <text x="892" y="123" font-size="13" class="muted">Detected pattern · error streak · resolved</text>
  <text x="864" y="158" font-size="20" font-weight="600" class="ink">4 failed checks, then passed</text>
  <text x="864" y="184" font-size="13.5" class="ink">pnpm test failed 4 times in a row over 26 min;</text>
  <text x="864" y="203" font-size="13.5" class="ink">the 5th run passed after edits to 2 files.</text>

  <text x="864" y="240" class="mono cap muted">SELECTED STEP · 43 OF 118</text>
  <g transform="translate(864 252)">
    <use href="#s-err" x="0" y="0" width="16" height="16"/>
    <text x="24" y="13" font-size="13.5" font-weight="600" class="ink">Run · failed · exit 1</text>
    <text x="384" y="13" text-anchor="end" class="mono cnt">26.3 min</text>
    <rect x="0" y="28" width="384" height="34" rx="2" fill="#f6f3ea" stroke="#d9d3c3"/>
    <text x="12" y="50" class="mono ink" font-size="12.5">$ pnpm -s test</text>
