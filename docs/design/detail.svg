  <!-- compact trailhead (detail mode keeps the task visible) -->
  <text x="32" y="92" class="serif ink" font-size="22">Build phase 4: explore recorded gardens and share links</text>
  <text x="32" y="114" font-size="12.8" class="muted">Written reasoning is the agent's own account, not a record of how the model computed. <tspan class="ink" text-decoration="underline">How to read this map</tspan></text>

  <!-- main route window (episodes 4–7), dimmed except the expanded one -->
  <text x="32" y="150" class="mono cap muted">ROUTE · EPISODE 5 OF 10 · LANE EXPANDED</text>
  <!-- dimmed by colour, not opacity: strokes, glyphs and labels in ink-muted (DESIGN §8.3) -->
  <g>
    <path class="route" d="M32 186 H160" style="stroke:#4d5a52"/><use href="#k-user-dim" x="96" y="178" width="16" height="16"/><text x="104" y="168" class="ep" style="fill:#4d5a52">Resume</text>
    <path class="route" d="M640 186 H800" style="stroke:#4d5a52"/><use href="#k-delegate-dim" x="632" y="178" width="16" height="16"/><text x="646" y="168" class="ep" style="fill:#4d5a52">Design and a11y reviews</text>
  </g>
  <path class="route" d="M160 186 H640"/>
  <use href="#k-delegate" x="152" y="178" width="16" height="16"/>
  <text x="166" y="168" class="ep">Phase 4 UI, second run</text><text x="330" y="168" class="mono cnt">64 steps · 36 min</text>

