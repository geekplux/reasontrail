    <rect x="0" y="94" width="384" height="78" rx="2" fill="#f6f3ea" stroke="#d9d3c3"/>
    <text x="12" y="116" class="mono ink" font-size="12">FAIL  src/garden/state.test.ts</text>
    <text x="12" y="136" class="mono ink" font-size="12">  × restores the path from the URL</text>
    <text x="12" y="156" class="mono muted" font-size="12">  Tests  1 failed | 41 passed</text>
  </g>
  <!-- provenance -->
