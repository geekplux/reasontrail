  <use href="#k-explore" x="188" y="245" width="14" height="14"/><text x="196" y="280" class="ep" font-size="12.5">Read plan</text><text x="196" y="296" class="mono cnt">18</text>
  <use href="#k-change" x="259" y="245" width="14" height="14"/><text x="268" y="280" class="ep" font-size="12.5">Write state,</text><text x="268" y="296" class="ep" font-size="12.5">App</text><text x="268" y="312" class="mono cnt">24</text>
  <!-- selected episode: inverted -->
  <rect x="352" y="266" width="76" height="52" rx="2" fill="#1c2620"/>
  <use href="#k-verify" x="349" y="245" width="14" height="14"/><text x="358" y="282" font-size="12.5" font-weight="600" fill="#fffdf7">Run checks</text><text x="358" y="298" font-size="12.5" font-weight="600" fill="#fffdf7">×5</text><text x="358" y="312" class="mono" font-size="11.5" fill="#fffdf7">8 steps</text>
  <use href="#k-change" x="425" y="245" width="14" height="14"/><text x="436" y="280" class="ep" font-size="12.5">Write</text><text x="436" y="296" class="ep" font-size="12.5">flow</text><text x="436" y="312" class="mono cnt">14</text>
  <use href="#k-verify" x="505" y="245" width="14" height="14"/><text x="516" y="280" class="ep" font-size="12.5">Verify,</text><text x="516" y="296" class="ep" font-size="12.5">stage</text><text x="516" y="312" class="mono cnt">12</text>
  <use href="#k-answer" x="582" y="244" width="16" height="16"/><text x="594" y="280" class="ep" font-size="12.5">Report</text>
