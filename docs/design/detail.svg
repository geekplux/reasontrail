  <rect x="373" y="237" width="30" height="30" rx="3" fill="none" stroke="#2f55d4" stroke-width="2"/>
  <use href="#t-streak" x="378" y="242" width="20" height="20"/>
  <use href="#badge" x="390" y="230" width="16" height="16"/><text x="398" y="242" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#fffdf7">2</text>
  <use href="#t-revert" x="548" y="242" width="20" height="20"/>
  <use href="#badge" x="560" y="234" width="16" height="16"/><text x="568" y="246" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#fffdf7">3</text>

