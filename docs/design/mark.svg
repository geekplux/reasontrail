<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <title>Reasontrail mark and wordmark (DESIGN.md §4): trailhead, a route that turns, a dead-end spur, and the destination. Old garden mark shown as the lens icon.</title>
  <style>.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-weight:500}.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic}.ui{font-family:system-ui,sans-serif;font-size:12px;fill:#4d5a52}</style>
  <defs>
    <symbol id="mark" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="4.5" cy="20" r="3.5" fill="currentColor" stroke="none"/>
      <path d="M4.5 20 H11 L19 12 H22" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M11 20 H19.5" stroke-width="2"/><path d="M21.5 16.5 V23.5" stroke-width="2"/>
      <circle cx="26.5" cy="12" r="4" stroke-width="2.5"/><circle cx="26.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></g></symbol>
    <symbol id="lens" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="5" cy="16" r="3" fill="currentColor" stroke="none"/><path d="M5 16H12" stroke-width="4"/>
      <path d="M12 16C18 16 18 7 24.5 7" stroke-width="4"/><circle cx="26.5" cy="7" r="2.25" fill="currentColor" stroke="none"/>
      <path d="M12 16H24.5" stroke-width="2.5"/><circle cx="26.5" cy="16" r="1.75" fill="currentColor" stroke="none"/>
      <path d="M12 16C18 16 18 25 24.5 25" stroke-width="1.25"/><circle cx="26.5" cy="25" r="1.4" fill="currentColor" stroke="none"/></g></symbol>
  </defs>
  <rect width="320" height="200" fill="#f6f3ea"/><rect x="320" width="320" height="200" fill="#111813"/>
  <g color="#1c2620"><use href="#mark" x="24" y="24" width="96" height="96"/><use href="#mark" x="140" y="56" width="32" height="32"/><use href="#mark" x="190" y="64" width="16" height="16"/>
    <use href="#mark" x="24" y="140" width="32" height="32"/><text x="62" y="164" class="mono" font-size="20" fill="#1c2620">reason</text><text x="134" y="164" class="serif" font-size="25" fill="#1c2620">trail</text>
    <use href="#lens" x="240" y="56" width="32" height="32"/><text x="234" y="108" class="ui">lens icon</text></g>
  <g color="#e9eee7"><use href="#mark" x="344" y="24" width="96" height="96"/><use href="#mark" x="460" y="56" width="32" height="32"/><use href="#mark" x="510" y="64" width="16" height="16"/>
    <use href="#mark" x="344" y="140" width="32" height="32"/><text x="382" y="164" class="mono" font-size="20" fill="#e9eee7">reason</text><text x="454" y="164" class="serif" font-size="25" fill="#e9eee7">trail</text>
    <use href="#lens" x="560" y="56" width="32" height="32"/></g>
</svg>
